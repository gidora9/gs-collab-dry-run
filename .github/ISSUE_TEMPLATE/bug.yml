name: Bug
description: Something broken that blocks demo or daily use
title: "[bug] "
labels: ["triage"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: posthog
    attributes:
      label: PostHog Error / Replay link (if any)
      description: Paste PostHog issue or session replay URL (or query via PostHog MCP).
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - demo-blocker
        - high
        - medium
        - low
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent policy
      options:
        - agent-ready
        - human-only
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Human owner
      options:
        - Ebrahim
        - Mehrad
        - Farzad
    validations:
      required: true
