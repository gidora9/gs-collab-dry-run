name: Chore
description: Infra, docs, CI, deliverables (summary/deck/demo wiring)
title: "[chore] "
labels: ["triage"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Hackathon relevance in one sentence.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent policy
      options:
        - agent-ready
        - human-only
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Human owner
      options:
        - Ebrahim
        - Mehrad
        - Farzad
    validations:
      required: true
  - type: checkboxes
    id: deliverable
    attributes:
      label: Hackathon deliverable?
      options:
        - label: summary
        - label: pitch-deck
        - label: demo-link
